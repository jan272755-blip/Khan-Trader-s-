# Netlify Configuration File
# Documents the build settings and redirects for hosting on Netlify.

[build]
  # Directory that contains the deploy-ready HTML files and assets generated by Vite
  publish = "dist"

  # The command to execute to build the application
  command = "npm run build"

# Handle Single-Page Application (SPA) routing fallback on reload
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
